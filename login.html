<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login - BloodConnect</title>
  <link rel="icon" href="assets/veindrop-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="login.css?v=20260827h" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <div class="glass-rect-layer" aria-hidden="true">
    <span class="glass-rect glass-rect-left-wide"></span>
    <span class="glass-rect glass-rect-left-slim"></span>
    <span class="glass-rect glass-rect-right-wide"></span>
    <span class="glass-rect glass-rect-right-slim"></span>
  </div>
  <main class="login-stage">
    <div class="login-shell">

      <section class="form-panel">
        <div class="form-card">
          <a href="homie.html" class="home-fab" aria-label="Go to home page">
            <i class="fa-solid fa-arrow-left-long"></i>
          </a>
          <h1 class="form-title">Login</h1>

          <form action="#" method="POST" class="login-form" novalidate>
            <div class="form-group">
              <label for="email">Email</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" id="email" name="email" placeholder="you@gmail.com" required autocomplete="email" />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password" name="password" placeholder="••••••••••" required
                  autocomplete="current-password" />
                <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                  <i class="fa-solid fa-eye" id="toggleIcon"></i>
                </button>
              </div>
            </div>

            <div class="form-options solo-link">
              <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-primary">Login</button>

            <div id="alertBox" class="toast-alert" role="status" aria-live="polite"></div>

            <p class="meta-link"><a href="#">Terms and Services</a></p>
            <p class="support-link">Have a problem? Contact support.</p>

            <div class="form-footer">
              <p>Don't have an account? <a href="register.html" class="link-accent">Register Now</a></p>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=20260825a"></script>
  <script>
    const loginUrl = new URL(window.location.href);
    const nextDestination = loginUrl.searchParams.get('next');
    const freshLoginRequested = loginUrl.searchParams.get('fresh') === '1';

    (async function initLoginPage() {
      const url = new URL(window.location.href);
      const justRegistered = url.searchParams.get('registered') === '1';

      if (justRegistered || freshLoginRequested) {
        await clearAuthSession();
        url.searchParams.delete('registered');
        url.searchParams.delete('fresh');
        const query = url.searchParams.toString();
        const cleanUrl = `${url.pathname}${query ? `?${query}` : ''}${url.hash}`;
        window.history.replaceState({}, '', cleanUrl);
        return;
      }

      // Only auto-redirect when the login page was opened for a specific destination.
      // This prevents a previously saved session from immediately taking over when a user
      // simply opens the sign-in page to log in with another account.
      if (nextDestination) {
        await redirectIfLoggedIn();
      }
    })();

    const passwordInput = document.getElementById('password');
    const toggleBtn = document.querySelector('.toggle-password');
    const toggleIcon = document.getElementById('toggleIcon');
    const homeLink = document.querySelector('.home-fab');

    if (homeLink) {
      homeLink.addEventListener('click', (event) => {
        event.preventDefault();
        document.body.classList.add('page-leave');
        setTimeout(() => {
          window.location.href = homeLink.href;
        }, 360);
      });
    }

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleIcon.classList.toggle('fa-eye', !isPassword);
      toggleIcon.classList.toggle('fa-eye-slash', isPassword);
    });

    // Left visual slideshow
    const slides = Array.from(document.querySelectorAll('.show-slide'));
    const dots = Array.from(document.querySelectorAll('.showcase-dots .dot'));
    let activeSlideIndex = 0;

    function setSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle('is-active', i === index);
      });
      dots.forEach((dot, i) => {
        dot.classList.toggle('is-active', i === index);
      });
      activeSlideIndex = index;
    }

    setInterval(() => {
      const nextIndex = (activeSlideIndex + 1) % slides.length;
      setSlide(nextIndex);
    }, 3200);

    // Handle login form submission
    const alertBox = document.getElementById('alertBox');
    let alertTimer = null;

    function showAlert(message, type, targetInput = null) {
      alertBox.textContent = message;
      alertBox.className = `toast-alert show ${type === 'error' ? 'error' : 'success'}${targetInput ? ' field-popover' : ''}`;

      alertBox.style.removeProperty('--popover-top');
      alertBox.style.removeProperty('--popover-left');
      alertBox.style.removeProperty('--popover-width');

      if (targetInput) {
        const cardRect = targetInput.closest('.form-card').getBoundingClientRect();
        const inputRect = targetInput.getBoundingClientRect();
        alertBox.style.setProperty('--popover-top', `${inputRect.top - cardRect.top}px`);
        alertBox.style.setProperty('--popover-left', `${inputRect.left - cardRect.left}px`);
        alertBox.style.setProperty('--popover-width', `${inputRect.width}px`);
      }

      clearTimeout(alertTimer);
      alertTimer = setTimeout(() => {
        alertBox.classList.remove('show');
      }, 5000);
    }

    // Try server-side PHP login as a fallback for accounts created via the PHP API
    async function attemptPhpLogin(email, password) {
      try {
        const res = await fetch('/api/login.php', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const json = await res.json().catch(() => ({}));
        if (!res.ok) {
          return { data: null, error: { message: json.error || json.message || `PHP login failed (HTTP ${res.status})` } };
        }

        return { data: json.data || null, error: null };
      } catch (err) {
        return { data: null, error: { message: 'Network error while contacting server.' } };
      }
    }

    document.querySelector('.login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = e.target.querySelector('.btn-primary');

      if (!email || !password) {
        const missingInput = !email
          ? document.getElementById('email')
          : document.getElementById('password');
        showAlert('Please fill in all fields.', 'error', missingInput);
        missingInput.classList.add('is-required');
        missingInput.setAttribute('aria-invalid', 'true');
        missingInput.focus();
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

      try {
          const { data, error } = await signIn(email, password);

          // If Supabase says invalid credentials, try the PHP login API as a fallback
          if (error) {
            const msg = String(error.message || '').toLowerCase();
            const isInvalid = msg.includes('invalid') || msg.includes('credentials') || msg.includes('password');
            if (isInvalid) {
              try {
                const php = await attemptPhpLogin(email, password);
                if (php && php.data) {
                  // PHP session set via cookie; perform same redirect logic
                  showAlert('Login successful! Redirecting...', 'success');
                  setTimeout(() => {
                    if (nextDestination) {
                      window.location.href = nextDestination;
                      return;
                    }
                    const role = php.data.profile?.role || php.data.user?.role || 'patient';
                    if (role === 'admin') {
                      window.location.href = 'admin_dashboard.html';
                    } else {
                      window.location.href = 'patient_dashboard.html';
                    }
                  }, 600);
                  return;
                }
              } catch (phpErr) {
                console.warn('PHP login fallback failed', phpErr);
              }
            }

            showAlert(error.message || 'An unknown error occurred.', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
            return;
          }

        showAlert('Login successful! Redirecting...', 'success');

        // Role-based redirect
        setTimeout(() => {
          if (nextDestination) {
            window.location.href = nextDestination;
            return;
          }

          const role = data.profile.role;
          if (role === 'admin') {
            window.location.href = 'admin_dashboard.html';
          } else {
            window.location.href = 'patient_dashboard.html';
          }
        }, 600);

      } catch (error) {
        console.error('Login error:', error);
        showAlert('Could not connect to the server.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
      }
    });

    document.querySelectorAll('.login-form input').forEach((input) => {
      input.addEventListener('input', () => {
        input.classList.remove('is-required');
        input.removeAttribute('aria-invalid');
        if (alertBox.classList.contains('field-popover')) {
          alertBox.classList.remove('show');
        }
      });
    });
  </script>
  <script src="pull-to-refresh.js?v=20260824a" defer></script>
</body>

</html>
