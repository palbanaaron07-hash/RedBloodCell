name: Build and Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Upload to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Copy Server Config and PHP API
        run: |
          if [ -f ".htaccess" ]; then
            cp .htaccess dist/
          fi
          if [ -f "default.php" ]; then
            cp default.php dist/
          fi
          if [ -f "index.php" ]; then
            cp index.php dist/
          fi
          if [ -d "api" ]; then
            cp -r api dist/
          fi

      - name: Deploy to FTP Server (both paths)
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1

          # Upload to public_html/bloodconnect/
          echo "=== Deploying to public_html/bloodconnect/ ==="
          lftp -e "
            set ssl:verify-certificate false;
            set ftp:ssl-allow yes;
            mirror --reverse --delete --verbose ./dist/ /public_html/bloodconnect/;
            bye
          " -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}"

          # Also upload to FTP root
          echo "=== Deploying to FTP root ==="
          lftp -e "
            set ssl:verify-certificate false;
            set ftp:ssl-allow yes;
            mirror --reverse --delete --verbose ./dist/ /;
            bye
          " -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}"

          echo "=== Done ==="
