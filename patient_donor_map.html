<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Find Donors - VeinDrop</title>
  <link rel="icon" href="assets/veindrop-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="patient_donor_map.css?v=20260827b" />
  <link rel="stylesheet" href="patient_mobile_nav.css?v=20260811a" />
</head>
<body>
  <main class="map-page">
    <div id="donorMap" class="donor-map" role="application" aria-label="Map of compatible donor zones in Bohol"></div>

    <header class="map-header">
      <a class="icon-button map-back-button" href="patient_dashboard.html" aria-label="Back to dashboard">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div>
        <h1>Find Donors</h1>
        <p id="searchSummary">Tap search to find compatible donors nearby.</p>
      </div>
      <button class="icon-button" id="locateButton" type="button" aria-label="Center Bohol map">
        <i class="fa-solid fa-location-crosshairs"></i>
      </button>
    </header>

    <section class="filter-panel" aria-label="Compatible donor search">
      <button class="compatible-search-btn" id="compatibleSearchBtn" type="button">
        <i class="fa-solid fa-magnifying-glass-location"></i>
        Look for Compatible Donor
      </button>
    </section>

    <section class="zone-card" id="zoneCard" aria-live="polite">
      <button class="zone-close" id="closeZoneCard" type="button" aria-label="Close donor area details">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <span class="zone-label">Donors in this area</span>
      <strong id="zoneCount" class="sr-only">Select a donor marker</strong>
      <p id="zoneDetails">Tap a marker to view compatible donors nearby.</p>
      <div class="donor-profile-list" id="donorProfileList"></div>
    </section>

    <div class="map-legend">
      <span><i class="legend-dot donor"></i> Donors</span>
      <span><i class="legend-dot hospital"></i> Hospitals</span>
      <span><i class="legend-dot needed"></i> Needed</span>
    </div>

    <div class="map-toast" id="mapToast" role="status" aria-live="polite"></div>
  </main>

  <nav class="mobile-bottom-nav" aria-label="Patient navigation">
    <a class="mobile-nav-item" href="patient_dashboard.html" aria-label="Home">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </a>
    <button class="mobile-nav-search active" type="button" aria-label="Search donors" aria-current="page">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Search</span>
    </button>
    <a class="mobile-nav-item" href="patient_dashboard.html#section-profile" aria-label="Profile">
      <i class="fa-solid fa-user"></i>
      <span>Profile</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-client.js?v=20260824b"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/scripts/pages/patient-donor-map.js?v=20260901a"></script>
  <script src="/pull-to-refresh.js?v=20260824a" defer></script>
</body>
</html>
